<style>
:root{--bg:#f4f6fa;--panel:#fff;--text:#202633;--muted:#778091;--line:#e5e9f0;--accent:#4778e8;--soft:#edf2ff;--shadow:0 8px 28px rgba(28,42,70,.07);--danger:#d84c4c;--long:#15966b;--short:#dc5964}
[data-theme="dark"]{--bg:#141820;--panel:#1e2530;--text:#edf1f7;--muted:#9aa5b5;--line:#333d4b;--accent:#83a8ff;--soft:#293750;--shadow:0 8px 28px rgba(0,0,0,.22);--danger:#ff7777;--long:#4ac99a;--short:#ff7882}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;transition:background .2s,color .2s}
button{border:0;cursor:pointer;font:inherit;color:inherit}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
header{height:68px;padding:0 clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:19px;font-weight:750;letter-spacing:.02em}.brand span{color:var(--accent)}.head-actions{display:flex;gap:9px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}.icon-btn:hover,.tool-btn:hover,.small-icon:hover{background:var(--soft)}
main{max-width:1800px;margin:0 auto;padding:30px clamp(16px,4vw,48px) 100px}
.topline{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:12px}.topline h1{font-size:25px;margin:0 0 5px}.sub,.hint{color:var(--muted);font-size:12px}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:20px}

<div class="settings-panel" id="settingsPanel"><h3>設定</h3><div class="setting-row"><span>ダークモード</span><div class="switch" id="themeSwitch" role="switch" aria-label="ダークモード"></div></div><div class="setting-row"><span>全項目を保存・バックアップ</span><button id="exportBtn">書き出す</button></div><div class="setting-row"><span>バックアップから復元</span><button id="importBtn">読み込む</button><input type="file" id="importFile" accept="application/json" hidden></div></div>

<div class="field full"><label>画像</label><div class="upload"><input type="file" id="imageFile" accept="image/*"><div class="preview-wrap" id="previewWrap"><img id="previewImage" alt=""></div><button type="button" class="small-icon danger" id="removeImage" style="display:none;margin:8px auto 0" aria-label="画像を外す"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button></div></div>

<div class="field"><label>売買方向</label><div class="direction-select"><button type="button" class="direction-option long active" data-direction="long"><svg viewBox="0 0 24 24"><path d="M5 17 17 5M7 5h10v10"/></svg>Long</button><button type="button" class="direction-option short" data-direction="short"><svg viewBox="0 0 24 24"><path d="m5 7 12 12M7 19h10V9"/></svg>Short</button></div></div>

<script>
const DB_NAME='trade-journal-db',DB_VERSION=1,STORE='records';let db,currentImage=null,selectedDirection='long',selectedVerdict='',records=[];
const $=id=>document.getElementById(id);
const icons={edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>',delete:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>',long:'<svg viewBox="0 0 24 24"><path d="M5 17 17 5M7 5h10v10"/></svg>',short:'<svg viewBox="0 0 24 24"><path d="m5 7 12 12M7 19h10V9"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',ng:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'};
function verdictHTML(v){return v==='ok'?`<span class="direction ok">${icons.ok}OK</span>`:v==='ng'?`<span class="direction ng">${icons.ng}NG</span>`:'';}
function openDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DB_NAME,DB_VERSION);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(STORE))q.result.createObjectStore(STORE,{keyPath:'id'});};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function tx(mode,fn){return new Promise((resolve,reject)=>{const t=db.transaction(STORE,mode),s=t.objectStore(STORE);let v;try{v=fn(s)}catch(e){reject(e);return}t.oncomplete=()=>resolve(v);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error);});}
function getAll(){return new Promise((resolve,reject)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);});}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(v){if(!v)return '日時未設定';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}
function showToast(msg,ms=2200){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),ms);}
function newId(){try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<16;i++)a[i]=Math.random()*256;return Date.now().toString(36)+'-'+Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');}
function imageURL(blob){return blob?URL.createObjectURL(blob):'';}
const liveURLs={card:[],preview:[],detail:[],viewer:[]};
function trackURL(slot,blob){const u=imageURL(blob);if(u)liveURLs[slot].push(u);return u;}
function freeURLs(slot){liveURLs[slot].forEach(u=>URL.revokeObjectURL(u));liveURLs[slot]=[];}
function readBuf(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(fr.error||new Error('read failed'));fr.readAsArrayBuffer(b);});}
async function toMemBlob(b){if(!b)return null;const buf=await readBuf(b);if(!buf.byteLength)throw new Error('empty image');return new Blob([buf],{type:b.type||'image/png'});}
function watchBroken(im){im.addEventListener('error',()=>{if(!im.getAttribute('src'))return;const host=im.parentElement;if(host&&host.classList.contains('card-image'))host.removeAttribute('data-zoom');const sp=document.createElement('span');sp.className='no-image';sp.textContent='画像を読み込めません';im.replaceWith(sp);});}
function safeMemo(html=''){const template=document.createElement('template');template.innerHTML=html;template.content.querySelectorAll('script,style,iframe,object,embed').forEach(n=>n.remove());template.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{if(a.name.startsWith('on')||((a.name==='href'||a.name==='src')&&!a.value.startsWith('data:')))el.removeAttribute(a.name);});});return template.innerHTML;}
function memoPlain(html=''){const d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent||'';}
function memoSection(label,html){if(!html||!memoPlain(html).trim())return '';return `<div class="memo-part"><b>${label}</b><div>${safeMemo(html)}</div></div>`;}
function directionHTML(d){return d==='short'?`<span class="direction short">${icons.short}Short</span>`:`<span class="direction long">${icons.long}Long</span>`;}

const PAIR_RE=/(^|[^A-Za-z])(JPY|USD|EUR|GBP|AUD|NZD|CAD|CHF)\s*[\/\-_]?\s*(JPY|USD|EUR|GBP|AUD|NZD|CAD|CHF)(?![A-Za-z])/i;
function pairFlagsHTML(title,cls=''){const m=String(title||'').match(PAIR_RE);if(!m)return '';const a=m[2].toUpperCase(),b=m[3].toUpperCase();if(a===b)return '';const f=c=>`<span class="flag"><svg viewBox="0 0 512 512" aria-hidden="true">${FLAGS[c]}</svg></span>`;return `<span class="pair-flags ${cls}" title="${a}/${b}">${f(a)}${f(b)}</span>`;}
function markClipped(){document.querySelectorAll('.memo-preview').forEach(m=>m.classList.toggle('clipped',m.scrollHeight>m.clientHeight+1));}
window.addEventListener('resize',markClipped);
async function render(){records=(await getAll()).sort((a,b)=>(b.tradeDate||'').localeCompare(a.tradeDate||'')||(b.updatedAt||0)-(a.updatedAt||0));$('recordCount').textContent=records.length+' 件';const grid=$('records');freeURLs('card');grid.innerHTML='';if(!records.length){grid.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 6-7"/></svg><b>検証記録はまだありません</b></div>`;return;}for(const r of records){const url=trackURL('card',r.image);const card=document.createElement('article');card.className='card';card.dataset.open=r.id;card.innerHTML=`<div class="card-image" ${r.image?`data-zoom="${r.id}"`:''}>${r.image?`<img src="${url}" alt="">`:'<span class="no-image">画像なし</span>'}${pairFlagsHTML(r.title)}</div><div class="card-body"><h2 class="card-title">${esc(r.title)}</h2><div class="meta"><span>${esc(dateText(r.tradeDate))}</span>${directionHTML(r.direction)}${verdictHTML(r.verdict)}${r.method?`<span class="tag">${esc(r.method)}</span>`:''}</div><div class="meta"><span>SL：${esc(r.sl||'—')}</span><span>TP：${esc(r.tp||'—')}</span><span>Lot：${esc(r.lot||'—')}</span></div><div class="memo-preview">${memoSection('環境認識',r.environment)}${memoSection('エントリータイミング',r.timing)}${memoSection('反省点',r.reflection)}</div><div class="card-footer"><div class="actions"><button class="small-icon" data-edit="${r.id}" aria-label="編集">${icons.edit}</button><button class="small-icon danger" data-delete="${r.id}" aria-label="削除">${icons.delete}</button></div></div></div>`;grid.appendChild(card);card.querySelectorAll('.card-image img').forEach(watchBroken);}markClipped();}
function setVerdict(v){selectedVerdict=v||'';document.querySelectorAll('.verdict-option').forEach(b=>b.classList.toggle('active',b.dataset.verdict===selectedVerdict));}
function setDirection(d){selectedDirection=d;document.querySelectorAll('.direction-option').forEach(b=>b.classList.toggle('active',b.dataset.direction===d));}
async function openForm(r=null){$('recordForm').reset();$('recordId').value=r?.id||'';$('editorTitle').textContent=r?'記録を編集':'新しい検証記録';try{currentImage=r?.image?await toMemBlob(r.image):null;}catch(err){currentImage=r.image;}for(const k of ['title','tradeDate','method','sl','tp','lot'])$(k).value=r?.[k]||'';for(const k of ['environment','timing','reflection'])$(k).innerHTML=safeMemo(r?.[k]||'');setDirection(r?.direction||'long');setVerdict(r?.verdict||'');$('imageFile').value='';updatePreview();$('editor').showModal();}
function updatePreview(){const wrap=$('previewWrap');if(currentImage){freeURLs('preview');const u=trackURL('preview',currentImage);$('previewImage').src=u;wrap.style.display='flex';$('removeImage').style.display='grid';}else{freeURLs('preview');wrap.style.display='none';$('previewImage').removeAttribute('src');$('removeImage').style.display='none';}}
$('imageFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){showToast('画像ファイルを選択してください');return;}if(f.size>15*1024*1024){showToast('15MB以下の画像を選択してください');e.target.value='';return;}try{currentImage=await toMemBlob(f);}catch(err){showToast('画像を読み込めませんでした');e.target.value='';return;}updatePreview();});
$('previewImage').addEventListener('error',()=>{if(!$('previewImage').getAttribute('src'))return;showToast('画像を読み込めません。画像を選び直してください');$('previewWrap').style.display='none';});$('editor').addEventListener('close',()=>freeURLs('preview'));
$('removeImage').onclick=()=>{currentImage=null;$('imageFile').value='';updatePreview();};
document.querySelectorAll('.direction-option').forEach(b=>b.onclick=()=>setDirection(b.dataset.direction));
document.querySelectorAll('.verdict-option').forEach(b=>b.onclick=()=>setVerdict(selectedVerdict===b.dataset.verdict?'':b.dataset.verdict));
document.querySelectorAll('.editor-tools').forEach(bar=>bar.addEventListener('click',e=>{const b=e.target.closest('[data-command]');if(!b)return;const target=$(bar.dataset.target);target.focus();document.execCommand(b.dataset.command,false,null);}));
$('addBtn').onclick=()=>openForm();$('closeEditor').onclick=$('cancelEditor').onclick=()=>$('editor').close();
$('recordForm').onsubmit=async e=>{e.preventDefault();if(!$('title').value.trim()){showToast('タイトルを入力してください');$('title').focus();return;}try{const id=$('recordId').value||newId(),old=records.find(x=>x.id===id);const r={id,title:$('title').value.trim(),direction:selectedDirection,verdict:selectedVerdict,tradeDate:$('tradeDate').value,method:$('method').value.trim(),sl:$('sl').value.trim(),tp:$('tp').value.trim(),lot:$('lot').value.trim(),environment:safeMemo($('environment').innerHTML),timing:safeMemo($('timing').innerHTML),reflection:safeMemo($('reflection').innerHTML),image:currentImage,updatedAt:Date.now()};await tx('readwrite',s=>s.put(r));$('editor').close();await render();showToast(old?'記録を更新しました':'記録を保存しました');}catch(err){console.error(err);showToast('保存に失敗しました：'+(err&&err.message?err.message:err),5000);}};
function openDetail(r){const c=$('detailContent');freeURLs('detail');const img=r.image?`<img class="detail-image" data-detail-zoom src="${trackURL('detail',r.image)}" alt="">`:'';c.innerHTML=`<h1 class="detail-title">${pairFlagsHTML(r.title,'inline')}<span>${esc(r.title)}</span></h1>${img}<div class="meta"><span>${esc(dateText(r.tradeDate))}</span>${directionHTML(r.direction)}${verdictHTML(r.verdict)}${r.method?`<span class="tag">${esc(r.method)}</span>`:''}</div><div class="detail-meta"><div class="detail-cell"><small>SL</small><b>${esc(r.sl||'—')}</b></div><div class="detail-cell"><small>TP</small><b>${esc(r.tp||'—')}</b></div><div class="detail-cell"><small>Lot</small><b>${esc(r.lot||'—')}</b></div></div>${detailSection('環境認識',r.environment)}${detailSection('エントリータイミング',r.timing)}${detailSection('反省点',r.reflection)}`;const im=c.querySelector('[data-detail-zoom]');if(im)watchBroken(im);c.querySelector('[data-detail-zoom]')?.addEventListener('click',()=>openViewer(r.image));$('detail').showModal();}
function detailSection(title,html){return `<section class="detail-section"><h3>${title}</h3><div class="detail-text">${html&&memoPlain(html).trim()?safeMemo(html):'—'}</div></section>`;}
$('records').addEventListener('click',e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]'),zoomTarget=e.target.closest('[data-zoom]'),card=e.target.closest('[data-open]');if(edit){e.stopPropagation();openForm(records.find(x=>x.id===edit.dataset.edit));return;}if(del){e.stopPropagation();const r=records.find(x=>x.id===del.dataset.delete);if(r&&confirm('この記録を削除しますか？'))tx('readwrite',s=>s.delete(r.id)).then(render).then(()=>showToast('削除しました'));return;}if(zoomTarget){e.stopPropagation();const r=records.find(x=>x.id===zoomTarget.dataset.zoom);if(r?.image)openViewer(r.image);return;}if(card){const r=records.find(x=>x.id===card.dataset.open);if(r)openDetail(r);}});
$('closeDetail').onclick=()=>$('detail').close();
let scale=1,panX=0,panY=0,dragging=false,startX=0,startY=0,baseX=0,baseY=0;
function paintViewer(){const im=$('viewerImage');im.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;const stage=$('viewerStage');stage.style.cursor=scale>1?'grab':'default';}
function openViewer(blob){vPtrs.clear();vPinch=null;vMulti=false;vLastTap=null;dragging=false;freeURLs('viewer');const url=trackURL('viewer',blob),im=$('viewerImage');im.onload=()=>{const stage=$('viewerStage');const maxW=stage.clientWidth,maxH=stage.clientHeight;const fit=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight,1);scale=fit;panX=(maxW-im.naturalWidth*scale)/2;panY=(maxH-im.naturalHeight*scale)/2;im.style.width=im.naturalWidth+'px';im.style.height=im.naturalHeight+'px';paintViewer();};im.onerror=()=>{if(!im.getAttribute('src'))return;showToast('画像を読み込めません');if($('viewer').open)$('viewer').close();};im.src=url;$('viewer').showModal();}
function zoomAt(next,x,y){const old=scale;const f=vFitScale();next=Math.max(f,Math.min(8,next));const stage=$('viewerStage').getBoundingClientRect(),px=x-stage.left,py=y-stage.top;panX=px-(px-panX)*next/old;panY=py-(py-panY)*next/old;scale=next;if(scale<=f+1e-6){const im=$('viewerImage'),sg=$('viewerStage');panX=(sg.clientWidth-im.naturalWidth*scale)/2;panY=(sg.clientHeight-im.naturalHeight*scale)/2;}paintViewer();}
$('viewerStage').addEventListener('wheel',e=>{e.preventDefault();zoomAt(scale*(e.deltaY<0?1.15:.87),e.clientX,e.clientY);},{passive:false});
const vStage=$('viewerStage'),vPtrs=new Map();let vPinch=null,vMulti=false,vLastTap=null,vTapHandledAt=0;
function vFitScale(){const im=$('viewerImage');return im.naturalWidth?Math.min(vStage.clientWidth/im.naturalWidth,vStage.clientHeight/im.naturalHeight,1):1;}
function vToggleZoom(x,y){if(scale>1.05){const im=$('viewerImage'),f=vFitScale();scale=f;panX=(vStage.clientWidth-im.naturalWidth*f)/2;panY=(vStage.clientHeight-im.naturalHeight*f)/2;paintViewer();}else zoomAt(2,x,y);}
function vPinchState(){const [a,b]=[...vPtrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};}
vStage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;vPtrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:Date.now()});try{vStage.setPointerCapture(e.pointerId);}catch(_){}if(vPtrs.size===1){dragging=true;startX=e.clientX;startY=e.clientY;baseX=panX;baseY=panY;}else if(vPtrs.size===2){dragging=false;vMulti=true;vPinch=vPinchState();}});
vStage.addEventListener('pointermove',e=>{const p=vPtrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;if(vPtrs.size>=2&&vPinch){const n=vPinchState();panX+=n.cx-vPinch.cx;panY+=n.cy-vPinch.cy;zoomAt(scale*n.d/vPinch.d,n.cx,n.cy);vPinch=n;}else if(dragging){panX=baseX+e.clientX-startX;panY=baseY+e.clientY-startY;paintViewer();}});
function vEnd(e){const p=vPtrs.get(e.pointerId);vPtrs.delete(e.pointerId);if(vPtrs.size<2)vPinch=null;if(vPtrs.size===1){const r=[...vPtrs.values()][0];dragging=true;startX=r.x;startY=r.y;baseX=panX;baseY=panY;}else if(vPtrs.size===0){dragging=false;const tap=e.type==='pointerup'&&p&&e.pointerType!=='mouse'&&!vMulti&&Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<10&&Date.now()-p.t<300;vMulti=false;if(tap){const now=Date.now();if(vLastTap&&now-vLastTap.t<350&&Math.hypot(e.clientX-vLastTap.x,e.clientY-vLastTap.y)<40){vTapHandledAt=now;vLastTap=null;vToggleZoom(e.clientX,e.clientY);}else vLastTap={t:now,x:e.clientX,y:e.clientY};}}}
vStage.addEventListener('pointerup',vEnd);vStage.addEventListener('pointercancel',vEnd);
vStage.addEventListener('dblclick',e=>{if(Date.now()-vTapHandledAt<600)return;vToggleZoom(e.clientX,e.clientY);});
['gesturestart','gesturechange','gestureend'].forEach(t=>vStage.addEventListener(t,e=>e.preventDefault(),{passive:false}));
$('viewerClose').addEventListener('click',()=>$('viewer').close());
$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))$('viewer').close();});
$('settingsBtn').onclick=()=>$('settingsPanel').classList.toggle('open');document.addEventListener('click',e=>{if(!$('settingsPanel').contains(e.target)&&e.target!==$('settingsBtn')&&!$('settingsBtn').contains(e.target))$('settingsPanel').classList.remove('open');});
function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';$('themeSwitch').classList.toggle('on',dark);localStorage.setItem('tradeJournalTheme',dark?'dark':'light');}
$('themeSwitch').onclick=()=>setTheme(document.documentElement.dataset.theme!=='dark');setTheme(localStorage.getItem('tradeJournalTheme')==='dark');
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob);});}
function dataURLToBlob(url){const [meta,data]=url.split(',');const mime=(meta.match(/:(.*?);/)||[])[1]||'application/octet-stream';const bin=atob(data),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime});}
$('exportBtn').onclick=async()=>{const all=await getAll(),payload={app:'TradeJournal',version:2,exportedAt:new Date().toISOString(),records:[]};for(const r of all){const copy={...r};if(r.image)copy.imageData=await blobToDataURL(r.image);delete copy.image;payload.records.push(copy);}const blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trade-journal-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);showToast('全記録を書き出しました');};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='TradeJournal'||!Array.isArray(data.records))throw new Error('形式が違います');if(!confirm(`${data.records.length}件の記録を読み込みます。同じIDの記録は上書きされます。`))return;const t=db.transaction(STORE,'readwrite'),s=t.objectStore(STORE);for(const r of data.records){const copy={...r};if(copy.imageData){copy.image=dataURLToBlob(copy.imageData);delete copy.imageData;}if(!copy.direction)copy.direction='long';s.put(copy);}await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);});await render();showToast('バックアップを復元しました');}catch(err){alert('読み込みに失敗しました：'+err.message);}finally{e.target.value='';}};
(async()=>{try{db=await openDB();await render();}catch(e){console.error(e);alert('このブラウザでは保存機能を利用できません。');}})();
